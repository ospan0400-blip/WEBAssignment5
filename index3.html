<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #dfdddd;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .task-card {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-around">

        <div class="col-md-5">
            <h5 class="fw-bold mb-3">To-do list</h5>
            <div id="taskList"></div>
        </div>

        <div class="col-md-5">
            <h5 class="fw-bold mb-3">Add new task</h5>
            <div class="card p-4">
                <label for="taskInput" class="form-label">* Title</label>
                <input type="text" id="taskInput" class="form-control mb-3" placeholder="Enter task title">

                <label for="descriptionInput" class="form-label">* Description </label>
                <textarea id="descriptionInput" class="form-control mb-3" rows="4" placeholder="Enter task description"></textarea>

                <button class="btn btn-primary w-100" onclick="addTask()"> Add Task </button>
            </div>
        </div>
    </div>
</div>

<script>
    let tasks = [];

    function addTask() {
        let titleInput = document.getElementById("taskInput");
        let descriptionInput = document.getElementById("descriptionInput");

        let title = titleInput.value.trim();
        let description = descriptionInput.value.trim();

        if (title === "" || description === "") {
            alert("Please enter both title and description!");
            return;
        }

        tasks.push({
            title: title,
            description: description,
            completed: false
        });

        titleInput.value = "";
        descriptionInput.value = "";

        showTasks();
    }

    function showTasks() {
        let list = document.getElementById("taskList");
        list.innerHTML = '';

        tasks.forEach(function(task, index) {
            let card = document.createElement("div");
            card.className = "task-card";

            let row = document.createElement("div");
            row.className = "d-flex justify-content-between align-items-center";

            let title = document.createElement("strong");
            title.textContent = task.title;
            title.style.cursor = "pointer";

            if (task.completed) {
                title.className = "completed";
            }

            title.onclick = function() {
                task.completed = !task.completed;
                showTasks();
            };

            let button = document.createElement("button");
            button.textContent = "Delete";
            button.className = "btn btn-sm btn-danger";

            button.onclick = function() {
                tasks.splice(index, 1);
                showTasks();
            };

            let description = document.createElement("p");
            description.textContent = task.description;
            description.className = "mt-2 mb-0";

            if (task.completed) {
                description.className += " completed";
            }

            row.appendChild(title);
            row.appendChild(button);

            card.appendChild(row);
            card.appendChild(description);

            list.appendChild(card);
        });
    }
</script>

</body>
</html>
